
services:
  olymptrade-bridge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ctai-olymptrade-bridge

    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    environment:
      APP_NAME: CTAI-Olymptrade-Bridge
      APP_VERSION: "0.1.0"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"

      OLYMPTRADE_ENABLED: "false"
      MARKET_DATA_ENABLED: "false"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      
